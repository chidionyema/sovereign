name: ci
on: [push, pull_request]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        # 1.79, not stable: rust-toolchain.toml pins channel 1.79, and with @stable
        # the action installs stable's rustfmt while `cargo fmt` inside the repo
        # overrides to 1.79 -- which has no components -- and every run dies at
        # "'cargo-fmt' is not installed for the toolchain '1.79-aarch64-apple-darwin'"
        # (measured, runs 35205838350 and the two below it, red since 2026-09-17).
        # Install the pinned channel WITH the components; the pin and CI then agree.
      - uses: dtolnay/rust-toolchain@1.79
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e concierge[dev]
      - run: pip install -e vision_brain[dev]
      - run: ruff check concierge vision_brain
      - run: pytest concierge/tests vision_brain/tests -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e concierge[dev] -e vision_brain[dev] -e integration[dev]
      - run: cargo build -p sovereign-sentinel --features dev-http
      - run: |
          (cargo run -p sovereign-sentinel --features dev-http 2>&1 &) && \
          sleep 3 && \
          pytest integration -q -m integration || true
